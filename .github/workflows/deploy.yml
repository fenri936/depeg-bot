name: CI/CD Production Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run syntax lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    needs: lint
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from GitHub Secrets
        run: |
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" > .env
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env
          echo "REDIS_CHANNEL=${{ secrets.REDIS_CHANNEL }}" >> .env
          echo "CHECK_INTERVAL=${{ secrets.CHECK_INTERVAL }}" >> .env
          echo "DEPEG_THRESHOLD=${{ secrets.DEPEG_THRESHOLD }}" >> .env
          echo "DEXSCREENER_API_URL=${{ secrets.DEXSCREENER_API_URL }}" >> .env

      - name: Build and deploy containers
        run: |
          docker compose down
          docker compose up -d --build

      - name: Cleanup old Docker images
        run: docker system prune -f

